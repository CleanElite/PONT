trong>Meniul zilei</strong><small hidden>Gestionează meniul, preparatele și programările.</small><span>›</span></button><button class="choice" type="button" data-module="city"><strong>Ieșire în oraș</strong><small hidden>Administrează evenimentele, promovările și rezervările.</small><span>›</span></button></div><p id="error" role="status"></p><div class="footer"><button id="logout" type="button">Deconectare</button></div></main><dialog id="notice"><h2>Acces neaprobat</h2><p id="noticeText"></p><button id="close" type="button">Am înțeles</button></dialog><script src="../super-admin/config.js"></script><script type="module">
const cfg=window.PONT_CONFIG||{},panel=document.getElementById('panel'),notice=document.getElementById('notice'),errorEl=document.getElementById('error');let db,restaurant;
const labels={menu:'Meniul zilei',city:'Ieșire în oraș'};
function denied(module){document.getElementById('noticeText').textContent='Contul tău nu este aprobat pentru accesul la secțiunea '+labels[module]+'. Contactează administratorul PONT pentru validarea accesului.';if(!notice.open)notice.showModal()}
document.getElementById('close').onclick=()=>notice.close();
async function check(){const {data:{user},error}=await db.auth.getUser();if(error||!user){location.replace('../login/');return}const {data:profile,error:pe}=await db.from('profiles').select('role').eq('user_id',user.id).maybeSingle();if(pe)throw pe;if(profile?.role==='super_admin'){location.replace('../super-admin/');return}if(profile?.role!=='restaurant')throw Error('Contul nu are rol de restaurant.');const {data:members,error:me}=await db.rpc('my_restaurant_access');if(me)throw me;const id=members?.[0]?.restaurant_id;if(!id)throw Error('Contul nu are un restaurant atribuit.');const {data:r,error:re}=await db.from('restaurants').select('name,enabled,menu_module_visible,city_module_visible').eq('id',id).single();if(re)throw re;restaurant=r;document.getElementById('restaurant').textContent=r.name||'Panou administrator restaurant';panel.hidden=false;const requested=new URLSearchParams(location.search).get('notapproved');if(requested==='menu'||requested==='city')denied(requested)}
document.querySelectorAll('[data-module]').forEach(button=>button.onclick=async()=>{const mod=button.dataset.module;try{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('../login/');return}const {data:members,error:me}=await db.rpc('my_restaurant_access');if(me)throw me;const id=members?.[0]?.restaurant_id;const {data:r,error:re}=await db.from('restaurants').select('enabled,menu_module_visible,city_module_visible').eq('id',id).single();if(re)throw re;if(r.enabled&&(mod==='menu'?r.menu_module_visible:r.city_module_visible)){location.href=mod==='menu'?'../admin-v2/':'../admin-evenimente/?pagina=adauga';return}denied(mod)}catch(e){errorEl.textContent=e.message}});
document.getElementById('logout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('../login/')};
try{if(!cfg.url||!cfg.anonKey)throw Error('Conexiunea PONT nu este configurată.');const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(cfg.url,cfg.anonKey);await check()}catch(e){panel.hidden=false;errorEl.textContent=e.message}
</script><script src="../pont-date-display.js?v=dmy-20261116" defer></script><link rel="stylesheet" href="../admin-neon.css?v=20261116-neon9">
