<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#031015">
<title>PONT Slobozia — Descoperă orașul</title>
<meta name="description" content="Descoperă meniul zilei și cele mai interesante locuri în care poți ieși în Slobozia.">
<link rel="canonical" href="https://pont.city/">
<script>if(!window.matchMedia('(min-width:1200px)').matches)window.location.replace('./');</script>
<link rel="stylesheet" href="./pont-selection.css?v=7">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041419}
main{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#041419}
main.entry{padding:clamp(140px,14vw,230px) 5vw 5vh;background:#041419;align-content:safe center}
main::before{content:"";position:absolute;z-index:-1;inset:-12px;background:url("./assets/pont-desktop-background.png") center center/cover no-repeat;filter:blur(5px) brightness(.78) saturate(.82);transform:scale(1.02)}
/* Header artwork is drawn at its original image aspect ratio, never stretched by cover. */
.desktop-header{position:absolute;top:0;left:0;width:100%;height:clamp(128px,13.4vw,218px);overflow:hidden;z-index:1;pointer-events:none}
.desktop-header::before{content:"";position:absolute;inset:0;background:url("./assets/pont-desktop-header-final.png") top center/100% auto no-repeat;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 76%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 76%,transparent 100%)}
.desktop-hotspot{position:absolute;z-index:2;display:block;top:clamp(25px,3.4vw,57px);height:clamp(39px,4.25vw,70px);border-radius:100px;cursor:pointer;text-decoration:none}
.desktop-hotspot:focus-visible{outline:3px solid #90f1f8;outline-offset:3px;background:#79cfe91c}
.desktop-hotspot.city{left:3.8%;width:18%}
.desktop-hotspot.admin{right:3%;width:20%}
.desktop-hotspot:hover{background:rgba(160,235,244,.07)}
.desktop-choices{width:min(88vw,1000px);grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;color:#fff;font-family:system-ui,sans-serif}
.desktop-choices .choice-card{height:clamp(138px,23vh,208px);padding-inline:26px}
.desktop-choices .choice-title{font-size:clamp(1.6rem,2.4vw,2.4rem)}
.desktop-choices .choice-caption{font-size:1rem}
@media(max-width:1199px){main{display:none}}
</style>
</head>
<body>
<main class="entry" aria-label="PONT Slobozia Desktop">
  <div class="desktop-header" aria-hidden="true"></div>
  <a class="desktop-hotspot city" href="./" aria-label="Slobozia — pagina principală"></a>
  <a class="desktop-hotspot admin" href="./login/" aria-label="Administrator — autentificare"></a>
<nav class="choice desktop-choices" aria-label="Alege între meniul zilei și ieșirea în oraș">
      <a class="choice-card day" href="./meniul-zilei/">
        <img class="choice-photo" src="./assets/choice-lunch.webp" alt="" width="414" height="339" decoding="async">
        <div class="choice-copy">
          <span class="choice-index"><span class="choice-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></span>La prânz</span>
          <h2 class="choice-title">Meniul zilei</h2>
          <p class="choice-caption">Vezi meniurile și prețurile de azi.</p>
        </div>
      </a>
      <a class="choice-card night" href="./iesire-in-oras/">
        <img class="choice-photo" src="./assets/choice-evening.webp" alt="" width="414" height="339" decoding="async">
        <div class="choice-copy">
          <span class="choice-index"><span class="choice-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M19 17A8 8 0 0 1 10 4a8.5 8.5 0 1 0 9 13Z"/></svg></span>Diseară</span>
          <h2 class="choice-title">Ieșire în oraș</h2>
          <p class="choice-caption">Evenimente, muzică și seri tematice.</p>
        </div>
      </a>
    </nav>
</main>
<div class="pont-pull-indicator" aria-hidden="true"></div>
<script defer src="./pont-selection-refresh.js?v=4"></script>
</body>
</html>
