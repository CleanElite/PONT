name: PONT accessibility QA
on:
  push:
    branches: [main]
    paths:
      - 'qa/accessibility.mjs'
      - '.github/workflows/pont-accessibility.yml'
      - 'pont-navigation.css'
      - 'pont-privacy-consent.js'
      - 'index.html'
      - 'meniul-zilei/index.html'
      - 'iesire-in-oras/index.html'
      - 'login/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 @axe-core/playwright@4.10.2
          npx playwright install chromium --with-deps
      - name: Run WCAG audit read-only
        run: node qa/accessibility.mjs
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pont-accessibility-qa
          path: qa-a11y/
          if-no-files-found: warn
          retention-days: 7
