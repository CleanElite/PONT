name: Import approved PONT desktop header
on:
  push:
    paths:
      - '.github/workflows/import-pont-desktop-header.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved desktop header artwork
        run: |
          curl -fLsS --retry 3 'https://at.adobe.com/Baf6bWgp2U3VXDHV' -o assets/pont-desktop-header-final.png
          file assets/pont-desktop-header-final.png
          test "$(head -c 8 assets/pont-desktop-header-final.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          test "$(stat -c%s assets/pont-desktop-header-final.png)" -gt 100000
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pont-desktop-header-final.png
          git diff --cached --quiet || (git commit -m "Add approved PONT desktop header image" && git push)
