name: Generate PONT home screen icons
on:
  push:
    branches: [main]
    paths:
      - 'pranz-slobozia/pont-app-icon-2026.svg'
      - '.github/workflows/pont-app-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install pillow
      - name: Build real PNG icons for iOS and Android
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          root = Path('pranz-slobozia')
          source = (root / 'pont-app-icon-2026.svg').read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^"]+)', source)
          if not match:
              raise RuntimeError('PONT icon source JPEG missing')
          original = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert('RGB')
          for filename, size in [('pont-180.png',180),('pont-192.png',192),('pont-512.png',512),('pont-maskable-512.png',512)]:
              target = original.resize((size,size), Image.Resampling.LANCZOS)
              target.save(root / filename, format='PNG', optimize=True)
              print(f'Generated {filename}: {target.size}')
          PY
      - name: Commit PNG files to website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pranz-slobozia/pont-180.png pranz-slobozia/pont-192.png pranz-slobozia/pont-512.png pranz-slobozia/pont-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Build PONT iOS and Android icon PNGs"
            git push
          fi
