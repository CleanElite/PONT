name: Publish PONT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify PONT files
        run: |
          test -s index.html
          test -s test/index.html
          test -s test/meniul-zilei/index.html
          touch .nojekyll
      - name: Render iPhone and Android icons from approved SVG
        run: |
          python -m pip install --quiet cairosvg pillow
          python test/build_icons.py
      - name: Generate logo-free curtain image
        run: |
          python build_intro_clean.py
          test -s assets/pont-intro-clean.jpg
      - name: Save verified curtain artwork for visual inspection
        run: |
          git add -f assets/pont-intro-clean.jpg assets/pont-intro-build-info.txt
          if ! git diff --cached --quiet; then
            git -c user.name="PONT Build Bot" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Update generated logo-free intro curtain image"
            git push origin HEAD:main
          fi
      - name: Upload site
        id: bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - name: Clear failed orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub returned 502 for this deployment but still considers it active.
          code=$(curl -sS -o /tmp/pont-pages-cancel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/3b3dc09d59da4c7fe263bb2ff3ace098b6593222/cancel")
          echo "Orphaned Pages deployment cleanup: HTTP ${code}"
          if [ "${code}" != "204" ] && [ "${code}" != "404" ]; then
            cat /tmp/pont-pages-cancel.json
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact_id }}
        with:
          script: |
            const repo = context.repo;
            const token = await core.getIDToken();
            core.setSecret(token);
            const {data} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo, artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha, oidc_token: token
            });
            core.setOutput('page_url', data.page_url);
            for (let poll = 0; poll < 120; poll++) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: data.id
              });
              if (result.data.status === 'succeed') return;
              if (['errored', 'deployment_failed', 'deployment_content_failed', 'cancelled'].includes(result.data.status)) {
                throw new Error('Pages deployment: ' + result.data.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Timed out waiting for Pages deployment ' + data.id);
