name: Publish PONT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify PONT files
        run: |
          test -s index.html
          test -s pranz-slobozia/index.html
          test -s pranz-slobozia/meniul-zilei/index.html
          touch .nojekyll
      - name: Prepare icon files
        run: |
          if [ ! -s pranz-slobozia/pont-180.png ] || [ ! -s pranz-slobozia/pont-192.png ] || [ ! -s pranz-slobozia/pont-512.png ] || [ ! -s pranz-slobozia/pont-maskable-512.png ]; then
            python -m pip install --quiet cairosvg pillow
            python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image
          folder=Path("pranz-slobozia")
          svg=(folder/"pont-app-icon.svg").read_bytes()
          for size in (180,192,512):
              out=folder/f"pont-{size}.png"
              if not out.is_file():
                  out.write_bytes(cairosvg.svg2png(bytestring=svg,output_width=size,output_height=size))
          out=folder/"pont-maskable-512.png"
          if not out.is_file():
              im=Image.new("RGBA",(512,512),"#062449")
              fg=Image.open(BytesIO(cairosvg.svg2png(bytestring=svg,output_width=410,output_height=410))).convert("RGBA")
              im.alpha_composite(fg,(51,51))
              im.save(out)
          PY
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
