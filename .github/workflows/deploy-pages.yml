name: Publish PONT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify PONT files
        run: |
          test -s index.html
          test -s pranz-slobozia/index.html
          test -s pranz-slobozia/meniul-zilei/index.html
          touch .nojekyll
      - name: Generate correctly padded iOS and Android icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image
          folder = Path("pranz-slobozia")
          svg = (folder / "pont-app-icon.svg").read_bytes()
          for size in (180, 192, 512):
              png = cairosvg.svg2png(bytestring=svg, output_width=size, output_height=size)
              (folder / f"pont-{size}.png").write_bytes(png)
          # Android adaptive icon: central design sits within safe area.
          size = 512
          base = Image.new("RGBA", (size, size), "#092d34")
          foreground = Image.open(BytesIO(cairosvg.svg2png(bytestring=svg, output_width=410, output_height=410))).convert("RGBA")
          base.alpha_composite(foreground, ((size-410)//2, (size-410)//2))
          base.convert("RGB").save(folder / "pont-maskable-512.png")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
