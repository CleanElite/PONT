name: Publish PONT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify PONT files
        run: |
          test -s index.html
          test -s pranz-slobozia/index.html
          test -s pranz-slobozia/meniul-zilei/index.html
          touch .nojekyll
      - name: Render iPhone and Android icons from approved SVG
        run: |
          python -m pip install --quiet cairosvg pillow
          python pranz-slobozia/build_icons.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
