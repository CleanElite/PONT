name: Publish PONT public preview
on:
  push:
    branches: [main]
    paths:
      - 'pranz-slobozia/**'
      - '.github/workflows/pont-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pont-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public preview without administrator source
        run: |
          mkdir -p _site
          cp -a pranz-slobozia/. _site/
          rm -rf _site/admin
          test -f _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
