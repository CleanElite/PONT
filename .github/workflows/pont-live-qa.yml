name: PONT live browser QA
on:
  push:
    branches: [main]
    paths:
      - 'qa/live-browser.mjs'
      - '.github/workflows/pont-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real-browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Run read-only QA against public PONT
        run: node qa/live-browser.mjs
      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pont-live-qa
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
