.pont-intro__panel{
  display:none;position:absolute;inset:0;
  background:var(--night) url("./assets/pont-intro-clean.jpg?v=clean-opaque-944f208") center / contain no-repeat;

.pont-intro__panel.left{clip-path:inset(0 50% 0 0);--curtain-motion:pont-curtain-left}
.pont-intro__panel.right{clip-path:inset(0 0 0 50%);--curtain-motion:pont-curtain-right}
.pont-intro.is-splitting .pont-intro__art{visibility:hidden}
.pont-intro.is-splitting .pont-intro__panel{
  display:block;animation:var(--curtain-motion) 1.32s linear both;
}

.pont-intro__led{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;
}

  fill:none;stroke:url(#pont-led-silver);stroke-width:1.15;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 4px #c8e9fa9c);
}

<script>
(() => {
  try {
    if (sessionStorage.getItem('pont-selection-refresh') === '1') {
      sessionStorage.removeItem('pont-selection-refresh');
      return;
    }
  } catch {}
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  if (motion.matches) return;

  const intro = document.querySelector('#pont-intro');
  const page = document.querySelector('.entry');
  const art = intro.querySelector('.pont-intro__art');
  const image = art.querySelector('img');
  const logo = page.querySelector('.entry-mark');
  const leftPanel = intro.querySelector('.pont-intro__panel.left');
  const led = intro.querySelector('.pont-intro__led');
  const ledGradient = led.querySelector('linearGradient');
  const [leftLed, rightLed] = led.querySelectorAll('path');
  let ledFrame;
  const curtainDuration = 1320;
  const root = document.documentElement;
  const liftDuration = 850;
  const revealDuration = 1480;
  let readyTimer, holdTimer, finishTimer, flightMotion;
  let started = false, leaving = false, finished = false;

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(readyTimer);
    clearTimeout(holdTimer);
    clearTimeout(finishTimer);
    cancelAnimationFrame(ledFrame);
    intro.hidden = true;
    page.classList.remove('intro-playing', 'intro-reveal');
    root.classList.remove('pont-intro-active');
    page.inert = false;
    flightMotion?.cancel();
    logo.style.removeProperty('transform');
    window.removeEventListener('pagehide', finish);
    window.removeEventListener('resize', onResize);
    document.removeEventListener('keydown', onKey);
    motion.removeEventListener?.('change', onMotion);
  }

  function onKey(event) {
    if (event.key === 'Escape') finish();
  }

  function onMotion(event) {
    if (event.matches) finish();
  }

  function onResize() {
    if (started) placeLogo();
  }

  function placeLogo() {
    if (typeof logo.animate !== 'function' || !logo.complete || !logo.naturalWidth) return;
    // The flight starts at the 260 × 108 wordmark crop in the new intro image.
    const bounds = intro.getBoundingClientRect();
    const scale = Math.min(bounds.width / image.naturalWidth, bounds.height / image.naturalHeight);
    const left = (bounds.width - image.naturalWidth * scale) / 2 + 303 * scale;
    const top = (bounds.height - image.naturalHeight * scale) / 2 + 688 * scale;
    const sourceWidth = 260 * scale;
    const sourceHeight = 108 * scale;
    if (!sourceWidth) return;

    // During the lift the logo is already moving relative to its live header position.
    if (leaving) return;
    logo.style.removeProperty('transform');
    const target = logo.getBoundingClientRect();
    if (!target.width || target.bottom <= 0) return;
    logo.style.transform = `translate(${left - target.left}px,${top - target.top}px) scale(${sourceWidth / target.width})`;
    page.classList.add('intro-playing');
  }

  function lightCurtain() {
    const startedAt = performance.now();
    function draw(now) {
      if (finished) return;
      const time = now - startedAt;
      const p = Math.min(time / curtainDuration, 1);
      const shape = getComputedStyle(leftPanel).clipPath;
      // Read the same interpolated edge that clips the panel, excluding its outer corners.
      const points = [...shape.matchAll(/([\d.]+)%\s+([\d.]+)%/g)].slice(1, -1);
      if (points.length > 1) {
        const path = mirror => points.map((point, index) =>
          (index ? 'L' : 'M') + (mirror ? 100 - Number(point[1]) : point[1]) + ' ' + point[2]
        ).join(' ');
        leftLed.setAttribute('d', path(false));
        rightLed.setAttribute('d', path(true));
        const rise = Math.min(1, Math.pow(Math.max(0, time) / 650, .68));
        const tip = 100 - rise * 96;
        ledGradient.setAttribute('y1', String(tip - 6));
        ledGradient.setAttribute('y2', String(tip + 32));
        led.style.opacity = String(Math.min(1, time / 80) * Math.min(1, (1 - p) * 4));
      }
      if (p < 1) ledFrame = requestAnimationFrame(draw);
      else led.style.opacity = '0';
    }
    ledFrame = requestAnimationFrame(draw);
  }

  function splitCurtain() {
    if (finished || leaving) return;
    leaving = true;
    if (page.classList.contains('intro-playing')) {
      flightMotion = logo.animate(
        [{ transform:logo.style.transform }, { transform:'none' }],
        { duration:liftDuration - 105, delay:105, easing:'cubic-bezier(.42,0,.26,1)', fill:'both' }
      );
    }
    intro.classList.add('is-splitting');
    page.classList.add('intro-reveal');
    lightCurtain();
    finishTimer = setTimeout(finish, revealDuration);
  }

  function ready() {
    if (finished || started) return;
    if (!image.naturalWidth) { finish(); return; }
    started = true;
    clearTimeout(readyTimer);
    placeLogo();
    holdTimer = setTimeout(splitCurtain, 950);
  }

  intro.hidden = false;
  page.inert = true;
  root.classList.add('pont-intro-active');
  window.addEventListener('pagehide', finish);
  window.addEventListener('resize', onResize);
  document.addEventListener('keydown', onKey);
  motion.addEventListener?.('change', onMotion);
  readyTimer = setTimeout(finish, 4000);
  Promise.all([image.decode(), logo.decode().catch(() => {})]).then(ready, finish);
})();
</script>
