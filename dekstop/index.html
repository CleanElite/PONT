<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PONT Slobozia | Meniul zilei și ieșire în oraș</title>
<link rel="stylesheet" href="../pont-selection.css?v=7">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#020c11;color:#fff;font-family:system-ui,sans-serif}
main.entry{display:grid;grid-template:clamp(70px,15.5dvh,136px) clamp(36px,8.4dvh,68px) minmax(0,1fr)/minmax(0,1fr);align-content:stretch;justify-items:stretch;gap:0;width:100%;height:100vh;height:100dvh;padding:0;background:#020c11}
.mast,.ticker{position:relative;background:#020d12}
.mast{display:grid;place-items:center;isolation:isolate;overflow:hidden}
.mast-ribbons{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.mast .brand,.mast .login{isolation:isolate}
.mast .brand{position:relative;display:block}
.mast .brand img{display:block;width:clamp(140px,min(16vw,34dvh),285px);height:auto;mix-blend-mode:screen}
.mast .brand::before,.mast .login::before{content:"";position:absolute;z-index:-1;inset:-5px -12px;
  border-radius:18px;background:#020d12;box-shadow:0 0 18px 10px #020d12;pointer-events:none}
.cta{border:1px solid #e7b86d;border-radius:999px;background:#060a0bda;font-weight:650;color:white}
.mast .login{position:absolute;top:clamp(6px,1.4dvh,14px);right:clamp(16px,1.8vw,30px);display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 2px;color:#dfd4c3;font-size:clamp(12px,.85vw,14px);font-weight:550;line-height:1.3}
.login svg{width:14px;height:14px;color:#dcb679}
.mast .login:is(:hover,:focus-visible){color:#fff0d8;text-decoration:underline;text-underline-offset:4px}
.entry .ticker {
  display:flex;align-items:center;gap:clamp(16px,2vw,34px);padding-inline:clamp(20px,4vw,72px);
  overflow:hidden;white-space:nowrap;color:#eee5d7;font-size:clamp(14px,1.16vw,20px);
  background:linear-gradient(180deg,#020c11,#081217 64%,#101719);
}
.ticker::after {
  content:"";position:absolute;inset:auto 0 0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#ad844d90 12%,#ac824d77 48%,#ffe6b6 61%,#b0875277 73%,transparent);
}
.ticker::before {
  content:"";position:absolute;left:61%;bottom:-3px;transform:translateX(-50%);width:clamp(58px,8vw,144px);height:7px;
  background:radial-gradient(ellipse,#ffe2a9aa,transparent 70%);pointer-events:none;
}
.sponsor-mark{display:inline-flex;align-items:center;flex:none;gap:clamp(15px,1.8vw,28px);font-size:1.48em;line-height:1;font-weight:750;letter-spacing:-.045em;color:#ffcf60}
.sponsor-mark::after{content:"";height:1.15em;width:1px;background:linear-gradient(transparent,#c09f6e99,transparent)}
.ticker-window{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 96%,transparent)}
.track,.sequence,.sequence>span{display:flex;align-items:center;flex:none;width:max-content}
.track{animation:roll 74s linear infinite}
.sequence>span{gap:clamp(20px,3vw,54px);padding-right:clamp(20px,3vw,54px);font-weight:450}
.sequence>span::after{content:"";width:clamp(22px,2.6vw,48px);height:1px;background:linear-gradient(90deg,transparent,#cba26a,transparent)}
@keyframes roll{to{transform:translateX(-50%)}}
.options{position:relative;isolation:isolate;overflow:hidden;background:#040e14}
.evening-photo,.lunch-photo,.spine{position:absolute;inset:0;pointer-events:none}
.lunch-photo{clip-path:url(#lunch-edge)}
.lunch-photo,.evening-photo{isolation:isolate}
.lunch-photo::before,.evening-photo::before{content:"";position:absolute;inset-block:0;z-index:-1}
.lunch-photo::before{left:0;width:61%;background:linear-gradient(90deg,transparent 27%,#030e1375 60%,#030e13 96%),url("./lunch-scene.jpg") left center/cover}
.evening-photo::before{right:0;width:65%;background:linear-gradient(90deg,#030e13 2%,#030e13a0 33%,transparent 75%),url("./evening-scene.jpg") right center/cover}
.spine{width:100%;height:100%;overflow:visible}
.option{position:absolute;inset:0;cursor:pointer}
.option.lunch{clip-path:url(#lunch-edge);z-index:2}
.option.evening{z-index:1}
.option-copy{position:absolute;top:9%;width:25%;transform:translateX(-50%);display:grid;justify-items:center;align-content:start;gap:clamp(6px,1.3dvh,15px);text-align:center;color:white;text-shadow:0 2px 8px #000}
.lunch .option-copy{left:37%}.evening .option-copy{left:65.5%}
.options:has(.lunch:is(:hover,:focus-visible)) .lunch-photo::before,
.options:has(.evening:is(:hover,:focus-visible)) .evening-photo::before{filter:brightness(1.18) saturate(1.12);transform:scale(1.018)}
.option:is(:hover,:focus-visible) .cta{border-color:#ffe1a0;box-shadow:0 0 8px #ffcf77,0 0 26px #eba74780}
.option:focus-visible .cta{outline:2px solid #fff4cd;outline-offset:4px}
@media(prefers-reduced-motion:no-preference){
.lunch-photo::before,.evening-photo::before{transition:filter .22s ease,transform .32s ease}
.cta{transition:box-shadow .22s,border-color .22s,background .22s}
}
@media(prefers-reduced-motion:reduce){
.options:has(.option:is(:hover,:focus-visible)) .lunch-photo::before,
.options:has(.option:is(:hover,:focus-visible)) .evening-photo::before{transform:none}
}
.option svg{width:clamp(35px,min(4.2vw,8dvh),72px);height:auto;color:#fff2cf;filter:drop-shadow(0 1px 3px #d58a36)}
.option strong{font:400 clamp(24px,min(3.1vw,7dvh),60px)/1.05 Georgia,serif}
.option strong::after{content:"";display:block;width:80%;height:2px;margin:clamp(6px,1.6dvh,16px) auto 0;background:linear-gradient(90deg,transparent,#da9a3b,#fff2bd,#da9a3b,transparent)}
.caption{font-size:clamp(12px,1.03vw,20px);line-height:1.35}
.cta{margin-top:.4em;padding:.73em 1.55em;font-size:clamp(14px,1.15vw,21px);box-shadow:0 0 5px #ffd785b3,0 0 16px #e997324d}
.option:hover .cta,.option:focus-visible .cta{background:#362916}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
</style>

<a class="ticker" data-pont-ad href="https://bolt.onelink.me/sbJ2/?pid=pont_city&amp;af_web_dp=https%3A%2F%2Fbolt.eu%2Fro-ro%2Frides%2F" aria-label="Deschide Bolt pentru o cursă"><span class="ad-window"><span class="ad-rail" aria-hidden="true"><span class="ad-message"><span>Ai planuri în oraș? Mergi cu</span><span class="ad-brand"><img width="53" height="32" src="../assets/pont-ticker-bolt.svg" alt="Bolt"></span><i class="ad-middle"></i><span>Descoperă și</span><span class="ad-brand"><img width="53" height="32" src="../assets/pont-ticker-bolt.svg" alt="Bolt"> Food</span></span></span></span></a>

<defs>
<clipPath id="lunch-edge" clipPathUnits="objectBoundingBox"><path d="M0 0 H.61 C.525 .095 .479 .284 .51 .495 S.499 .91 .36 1 H0 Z"/></clipPath>
<linearGradient id="shine" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffbe65"/><stop offset=".22" stop-color="#fff6d9"/><stop offset=".37" stop-color="#4fc9ff"/><stop offset=".54" stop-color="#ffefc8"/><stop offset=".73" stop-color="#ffad4c"/><stop offset=".90" stop-color="#59caff"/><stop offset="1" stop-color="#0870a0"/></linearGradient>

</defs><g stroke="url(#shine)"><use href="#seam" stroke-width="12" opacity=".5" style="filter:blur(6px)"/><use href="#seam" stroke-width="4"/><use href="#seam" stroke="white" stroke-opacity=".8" stroke-width="1"/></g></svg>
<a class="option lunch" href="../meniul-zilei/"><span class="option-copy"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 19a6 6 0 1 1 2-11 7 7 0 0 1 12 0 6 6 0 1 1 2 11v8H8zM8 23h16"/></svg><strong>Meniul zilei</strong><span class="caption">Vezi ofertele din restaurantele din Slobozia</span><span class="cta">Vezi meniul zilei</span></span></a>
<a class="option evening" href="../iesire-in-oras/"><span class="option-copy"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><g transform="rotate(18 10 16)"><path d="M6 5h8v9a4 4 0 0 1-8 0zM6 11h8M10 18v9m-4 0h8"/></g><g transform="rotate(-18 22 16)"><path d="M18 5h8v9a4 4 0 0 1-8 0zM18 11h8M22 18v9m-4 0h8"/></g></svg><strong>Ieșire în oraș</strong><span class="caption">Descoperă restaurante, baruri și evenimente</span><span class="cta">Vezi locațiile</span></span></a>

</main>
