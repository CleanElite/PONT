<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PONT Slobozia | Meniul zilei și ieșire în oraș</title>
<link rel="preload" as="image" href="./selectie-neon.jpg">
<link rel="stylesheet" href="../pont-selection.css?v=7">
<style>
html,body { margin:0; overflow:hidden; background:#04151b }
main.entry {
  display:grid; grid-template:1fr / 1fr; place-items:center; padding:0; gap:0;
  width:100%; height:100vh; height:100dvh;
  background:#04151b url("../assets/pont-desktop-background.png") center / cover no-repeat;
}
.scene {
  position:relative; width:min(100vw,177.777778vh); width:min(100vw,177.777778dvh);
  aspect-ratio:16/9; background:url("./selectie-neon.jpg") center / 100% 100% no-repeat;
}
@media(min-aspect-ratio:181/100) {
  .scene { mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent) }
}
@media(max-aspect-ratio:173/100) {
  .scene { mask-image:linear-gradient(180deg,transparent,#000 2%,#000 98%,transparent) }
}
.scene a { position:absolute; display:block; border-radius:999px }
.scene a:focus-visible { outline:2px solid #c4fbff; outline-offset:-2px }
.city { inset:5.4% auto auto 3.9%; width:14.5%; height:6.7% }
.home { inset:.8% auto auto 38%; width:24%; height:14% }
.admin { inset:5.4% 3.7% auto auto; width:15.6%; height:6.7% }
.lunch,.evening { top:32.5%; height:36%; width:27% }
.lunch { left:16.7% } .evening { right:16.8% }
.scene .sponsor { top:16.44%; height:5.21%; left:0; width:100%; overflow:hidden; border-radius:0 }
.ribbon { display:block; width:200%; height:100%; background-image:url("./selectie-neon.jpg");
  background-size:50% 1920%; background-position:0 17.338%; background-repeat:repeat-x;
  animation:marquee 32s linear infinite }
@keyframes marquee { to { transform:translateX(-50%) } }
@media(prefers-reduced-motion:reduce) { .ribbon { visibility:hidden } }
</style>
</head>
<body>
<main class="entry" aria-label="PONT Slobozia">
<nav class="scene" aria-label="Alege o secțiune">
  <a class="city" href="./" aria-label="Orașul selectat: Slobozia"></a>
  <a class="home" href="./" aria-label="PONT Slobozia — Acasă"></a>
  <a class="admin" href="../login/" aria-label="Administrator"></a>
  <a class="sponsor" href="https://glovoapp.com/ro/ro/slobozia" aria-label="Comandă prin Glovo în Slobozia"><span class="ribbon" aria-hidden="true"></span></a>
  <a class="lunch" href="../meniul-zilei/" aria-label="Meniul zilei — Vezi ofertele"></a>
  <a class="evening" href="../iesire-in-oras/" aria-label="Ieșire în oraș — Descoperă locațiile"></a>
</nav>
</main>
<div class="pont-pull-indicator" aria-hidden="true"></div>
<script defer src="../pont-selection-refresh.js?v=4"></script>
</body>
</html>
