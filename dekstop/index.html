  .scene a { position: absolute; border-radius: 999px; }
  .scene a:focus-visible { outline: 3px solid white; outline-offset: -3px; }
  .city { left: 4%; top: 4%; width: 14%; height: 9%; }
  .home { left: 35%; top: 1%; width: 30%; height: 17%; }

</style>
</head>

  <nav class="scene" aria-label="Selecție PONT">
