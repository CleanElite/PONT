<!doctype html>
<html lang="ro">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0e"><title>PONT Slobozia | Meniul zilei și restaurante</title><link rel="icon" type="image/svg+xml" href="./pont.svg">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./pont-180.png?v=4"><script src="./install.js?v=safari-4" defer></script>
<link rel="preload" as="image" href="./assets/pont-intro.jpg">
<style>
:root {
  color-scheme:dark;
  --night:#080b0e;
  --text:#f4f4f1;
  --muted:#bbc3c9;
  --line:rgba(210,228,239,.17);
  --ice:#b3e4f3;
  --bronze:#edd1a7;
  --art:url("./assets/pont-intro.jpg");
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;color:var(--text);background:var(--night);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
:where(a,button):focus-visible{outline:2px solid var(--ice);outline-offset:4px}
.entry{
  min-height:100svh;
  background:radial-gradient(ellipse at 50% 0,rgba(36,96,124,.16),transparent 39rem),var(--night);
}
.entry-header,.entry-content,.entry-footer{width:min(100% - 36px,1040px);margin-inline:auto}
.entry-header{
  min-height:86px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
}
.entry-mark{
  display:block;width:clamp(128px,18vw,168px);aspect-ratio:12/5;
  background-image:var(--art);background-size:177.7777778% auto;
  background-position:52.6785714% 45.5246914%;background-repeat:no-repeat;
  mix-blend-mode:screen;
}
.entry-location{
  margin:0;color:var(--muted);font-size:.67rem;font-weight:650;
  text-transform:uppercase;letter-spacing:.17em;
}
.pont-admin-entry{
  justify-self:end;display:flex;align-items:center;gap:7px;
  min-height:44px;padding:8px 3px;color:var(--muted);font-size:.75rem;
}
.pont-admin-entry svg,.install-button svg{width:15px;height:15px;flex:none}
.pont-admin-entry:hover,.install-button:hover{color:var(--text)}
.entry-heading{text-align:center;padding:clamp(28px,4.7vw,55px) 0 clamp(20px,3.6vw,34px)}
.entry-heading .entry-location{color:var(--ice);margin-bottom:9px}
.entry-heading h1{
  margin:0;font:400 clamp(2.28rem,6vw,4.65rem)/.99 Georgia,serif;
  letter-spacing:-.059em;text-wrap:balance;
}
.entry-heading em{font-weight:400;color:#d2e1e7}
.entry-description{margin:13px 0 0;color:var(--muted);font-size:clamp(.87rem,2.5vw,1rem)}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2vw,18px)}
.choice-card{
  --accent:var(--ice);position:relative;isolation:isolate;overflow:hidden;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:clamp(290px,46vw,410px);
  padding:clamp(12px,2.8vw,30px);border:1px solid var(--line);border-radius:clamp(15px,2.5vw,24px);
  background:#16191a;box-shadow:0 18px 38px #0003;
}
.choice-card.night{--accent:var(--bronze);background:#1a1411}
.choice-photo{
  position:absolute;z-index:-2;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 33%;
}
.choice-card::before{
  content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;
  background:linear-gradient(180deg,#07090b97 0,transparent 24%,#07090b16 39%,#07090bbd 67%,#08090a 98%);
}
.choice-card:hover,.choice-card:focus-visible{border-color:var(--accent)}
.choice-index{
  align-self:flex-start;display:inline-flex;align-items:center;gap:7px;max-width:100%;
  padding:6px 8px;color:#fff;background:#101214b8;border:1px solid #f4f8fc37;border-radius:6px;
  font-size:clamp(.60rem,1.25vw,.70rem);font-weight:650;letter-spacing:.10em;line-height:1.3;
}
.choice-index b{color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums}
.choice-title{
  margin:0;font:400 clamp(1.45rem,4.5vw,3.08rem)/1 Georgia,serif;
  letter-spacing:-.047em;text-wrap:balance;
}
.choice-caption{margin:9px 0 14px;color:#d7d9d8;font-size:clamp(.75rem,1.7vw,.94rem);line-height:1.45}
.choice-action{
  display:flex;align-items:center;justify-content:space-between;gap:5px;
  padding-top:9px;border-top:1px solid #edf6fa35;color:var(--accent);
  font-size:clamp(.71rem,1.6vw,.86rem);font-weight:650;
}
.choice-arrow{width:19px;height:19px;flex:none}
.entry-footer{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:clamp(18px,3vw,27px);padding:8px 0 max(12px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);color:var(--muted);font-size:.75rem;
}
.entry-footer p{margin:0}
.install-button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:8px 0;border:0;background:none;color:var(--ice);
  font-size:.78rem;font-weight:650;cursor:pointer;
}
#install-help{
  width:min(420px,calc(100% - 32px));max-height:85svh;padding:24px;
  border:1px solid var(--line);border-radius:18px;background:#111a20;color:var(--text);
}
#install-help h2{margin-top:0;font:400 2rem Georgia,serif}
#install-help::backdrop{background:#030507c9}
#install-help button{padding:8px 14px;border:1px solid var(--line);border-radius:8px}

.pont-intro{position:fixed;inset:0;z-index:20;overflow:hidden;overscroll-behavior:none}
.pont-intro__art{position:absolute;inset:0;background:#000}
.pont-intro__art img{display:block;width:100%;height:100%;object-fit:contain}
.pont-intro__well{
  display:none;position:absolute;
  background:radial-gradient(ellipse at center,#000 69%,transparent 100%);
}
.pont-intro__flight{display:none;position:absolute;inset:0 auto auto 0;transform-origin:0 0}
.pont-intro.is-matching :is(.pont-intro__well,.pont-intro__flight){display:block}
.entry.intro-playing .entry-mark{visibility:hidden}
.pont-intro__light{
  display:none;position:absolute;top:-32%;left:0;width:6rem;height:164%;pointer-events:none;
  background:linear-gradient(90deg,transparent,#b4eeff36 50%,transparent);
}
.pont-intro.is-leaving .pont-intro__art{
  -webkit-mask-image:linear-gradient(105deg,transparent 31%,#000 54%);
  mask-image:linear-gradient(105deg,transparent 31%,#000 54%);
  -webkit-mask-size:440% 160%;mask-size:440% 160%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:pont-unveil 1.03s cubic-bezier(.26,.70,.28,1) both;
}
.pont-intro.is-leaving .pont-intro__light{
  display:block;animation:pont-gleam 1.03s cubic-bezier(.26,.70,.28,1) both;
}
.pont-intro__skip{
  position:absolute;right:max(15px,env(safe-area-inset-right));
  bottom:calc(13px + env(safe-area-inset-bottom,0px));
  min-height:44px;padding:8px 13px;border:1px solid #eefaff3c;border-radius:999px;
  color:#eff4f7;background:#060a0ccf;font-size:.70rem;cursor:pointer;
}
.pont-intro.is-leaving .pont-intro__skip:not(:focus-visible){opacity:0;transition:opacity .2s}
html.pont-intro-active{overflow:hidden}
@keyframes pont-unveil{
  from{-webkit-mask-position:100% 50%;mask-position:100% 50%;opacity:1}
  74%{opacity:1}
  to{-webkit-mask-position:0 50%;mask-position:0 50%;opacity:0}
}
@keyframes pont-gleam{
  0%{transform:translateX(-22vw) rotate(15deg);opacity:0}
  26%{opacity:.48}
  76%{opacity:.33}
  100%{transform:translateX(112vw) rotate(15deg);opacity:0}
}

@media(max-width:520px){
  .entry-header,.entry-content,.entry-footer{width:calc(100% - 26px)}
  .entry-header{min-height:66px}
  .entry-header .entry-location{font-size:.56rem;letter-spacing:.10em}
  .pont-admin-entry{font-size:.64rem;gap:4px}
  .pont-admin-entry svg{width:12px;height:12px}
  .choice-card{min-height:clamp(279px,78vw,330px)}
  .choice-title{min-height:1.96em;display:flex;align-items:end}
  .choice-photo{object-position:50% 12%}
  .choice-caption{min-height:2.9em;margin:7px 0 11px}
}
@media(max-width:365px){
  .entry-header .entry-location{max-width:6ch;overflow-wrap:normal}
  .entry-footer{justify-content:center;text-align:center}
  .entry-footer p{width:100%}
}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
  .choice-card,.choice-photo,.choice-arrow{transition:transform .46s cubic-bezier(.2,.75,.25,1),border-color .24s}
  .choice-card:hover{transform:translateY(-3px)}
  .choice-card:hover .choice-photo{transform:scale(1.035)}
  .choice-card:hover .choice-arrow{transform:translateX(3px)}
}
@media(prefers-reduced-motion:reduce){.pont-intro{display:none!important}}
</style>
</head>
<body class="entry-page">
<div class="entry">
  <header class="entry-header">
    <p class="entry-location">Slobozia</p>
    <span class="entry-mark" role="img" aria-label="PONT Slobozia"></span>
    <a href="./login-manual/" class="pont-admin-entry" aria-label="Acces administrator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="9" r="4"/><path d="m11 12 8 8m-3-3 2-2m-4 0 2-2"/></svg>
      Administrator
    </a>
  </header>
  <main class="entry-content">
    <section class="entry-heading" aria-labelledby="entry-title">
      <p class="entry-location">Ghid local</p>
      <h1 id="entry-title">Unde mâncăm <em>azi?</em></h1>
      <p class="entry-description">Ce se gătește la prânz și unde ieșim diseară.</p>
    </section>
    <nav class="choice" aria-label="Alege între meniul zilei și ieșirea în oraș">
      <a class="choice-card day" href="./meniul-zilei/">
        <img class="choice-photo" src="./assets/pont-lunch.webp" alt="" width="700" height="933" decoding="async">
        <span class="choice-index"><b aria-hidden="true">01</b> La prânz</span>
        <div>
          <h2 class="choice-title">Meniul zilei</h2>
          <p class="choice-caption">Compară meniurile și prețurile de azi.</p>
          <span class="choice-action">Vezi meniurile
            <svg class="choice-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </span>
        </div>
      </a>
      <a class="choice-card night" href="./iesire-in-oras/">
        <img class="choice-photo" src="./assets/pont-evening.webp" alt="" width="700" height="933" decoding="async">
        <span class="choice-index"><b aria-hidden="true">02</b> Diseară</span>
        <div>
          <h2 class="choice-title">Ieșire în oraș</h2>
          <p class="choice-caption">Alege un local după atmosfera serii.</p>
          <span class="choice-action">Vezi localurile
            <svg class="choice-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </span>
        </div>
      </a>
    </nav>
  </main>
  <footer class="entry-footer">
    <p>PONT Slobozia</p>
    <button type="button" class="install-button" id="install-pont">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>
      Descarcă aplicația PONT
    </button>
  </footer>
  <dialog id="install-help" aria-labelledby="install-title">
    <h2 id="install-title">Instalează PONT</h2><p></p>
    <form method="dialog"><button class="install-button">Am înțeles</button></form>
  </dialog>
</div>
<div class="pont-intro" id="pont-intro" hidden>
  <div class="pont-intro__art" aria-hidden="true">
    <img src="./assets/pont-intro.jpg" alt="" width="1024" height="1536" fetchpriority="high">
    <span class="pont-intro__well"></span>
  </div>
  <span class="pont-intro__light" aria-hidden="true"></span>
  <span class="entry-mark pont-intro__flight" aria-hidden="true"></span>
  <button class="pont-intro__skip" type="button">Sari peste intro</button>
</div>
<script>
(() => {
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  if (motion.matches) return;

  const intro = document.querySelector('#pont-intro');
  const page = document.querySelector('.entry');
  const art = intro.querySelector('.pont-intro__art');
  const image = art.querySelector('img');
  const logo = page.querySelector('.entry-mark');
  const flight = intro.querySelector('.pont-intro__flight');
  const well = intro.querySelector('.pont-intro__well');
  const skip = intro.querySelector('button');
  const root = document.documentElement;
  const revealDuration = 1030;
  let readyTimer, holdTimer, finishTimer, flightMotion;
  let started = false, leaving = false, finished = false;

  function finish() {
    if (finished) return;
    finished = true;
    const restoreFocus = document.activeElement === skip;
    clearTimeout(readyTimer);
    clearTimeout(holdTimer);
    clearTimeout(finishTimer);
    intro.hidden = true;
    page.classList.remove('intro-playing');
    root.classList.remove('pont-intro-active');
    page.inert = false;
    flightMotion?.cancel();
    image.removeEventListener('load', ready);
    image.removeEventListener('error', finish);
    window.removeEventListener('pagehide', finish);
    window.removeEventListener('resize', onResize);
    document.removeEventListener('keydown', onKey);
    motion.removeEventListener?.('change', onMotion);
    if (restoreFocus) page.querySelector('.choice a')?.focus();
  }

  function onKey(event) {
    if (event.key === 'Escape') finish();
  }

  function onMotion(event) {
    if (event.matches) finish();
  }

  function onResize() {
    if (leaving) finish();
  }

  function matchLogo() {
    if (typeof flight.animate !== 'function') return;
    // The header and the flying wordmark show the same 576 × 240 region of the supplied artwork.
    const bounds = intro.getBoundingClientRect();
    const target = logo.getBoundingClientRect();
    const scale = Math.min(bounds.width / image.naturalWidth, bounds.height / image.naturalHeight);
    const left = (bounds.width - image.naturalWidth * scale) / 2 + 236 * scale;
    const top = (bounds.height - image.naturalHeight * scale) / 2 + 590 * scale;
    const sourceWidth = 576 * scale;
    const sourceHeight = 240 * scale;
    if (!target.width || !sourceWidth || target.bottom <= 0) return;

    Object.assign(well.style, {
      left:left + 'px', top:top + 'px', width:sourceWidth + 'px', height:sourceHeight + 'px',
    });
    flight.style.width = target.width + 'px';
    flightMotion = flight.animate([
      { transform:'translate(' + left + 'px,' + top + 'px) scale(' + (sourceWidth / target.width) + ')' },
      { transform:'translate(' + target.left + 'px,' + target.top + 'px) scale(1)' },
    ], { duration:revealDuration, easing:'cubic-bezier(.26,.70,.28,1)', fill:'both' });
    intro.classList.add('is-matching');
    page.classList.add('intro-playing');
  }

  function reveal() {
    if (finished || leaving) return;
    leaving = true;
    try { matchLogo(); } catch {}
    intro.classList.add('is-leaving');
    finishTimer = setTimeout(finish, revealDuration + 60);
  }

  function ready() {
    if (finished || started) return;
    if (!image.naturalWidth) { finish(); return; }
    started = true;
    clearTimeout(readyTimer);
    holdTimer = setTimeout(reveal, 1220);
  }

  intro.hidden = false;
  page.inert = true;
  root.classList.add('pont-intro-active');
  skip.addEventListener('click', finish, { once:true });
  art.addEventListener('animationend', finish, { once:true });
  window.addEventListener('pagehide', finish);
  window.addEventListener('resize', onResize);
  document.addEventListener('keydown', onKey);
  motion.addEventListener?.('change', onMotion);
  readyTimer = setTimeout(finish, 1450);
  if (image.complete) ready();
  else {
    image.addEventListener('load', ready, { once:true });
    image.addEventListener('error', finish, { once:true });
  }
})();
</script>
</body>
</html>
