<html lang="ro">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152720"><title>PONT Slobozia | Meniul zilei și restaurante</title><link rel="icon" type="image/svg+xml" href="./pont.svg">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./pont-180.png?v=4"><script src="./install.js?v=safari-4" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101814;color:#fbefdb;font:16px system-ui,sans-serif}.entry{min-height:100svh;display:grid;align-content:center;justify-items:center;padding:clamp(22px,5vw,64px) 16px;background:radial-gradient(ellipse at 50% 44%,#30473a,#101814 72%)}header{text-align:center}header p,footer,.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}header p,footer{color:#e0c595}h1{font:normal clamp(50px,9vw,92px)/.9 Georgia,serif;letter-spacing:-.06em;margin:14px 0 12px}.subtitle{color:#f4e7d4;font-size:.96rem}.choice{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1fr;width:min(100%,950px);min-height:clamp(310px,51vw,460px);margin:26px 0 18px;border:1px solid #ad8b5e;border-radius:clamp(19px,4vw,36px);overflow:hidden;background:#211713;box-shadow:0 25px 80px #0008}.scene,.seam{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}.seam{z-index:2}.choice a{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:13px;text-align:center;color:inherit;text-decoration:none;min-width:0;padding:18px 13px;transition:background-color .3s}.choice a:hover{background:#fff1}.choice a:focus-visible{outline:2px solid #d69e51;outline-offset:-7px}.choice .day{color:#27362b}.choice .night{color:#fff0d8}.symbol{width:58px;height:58px;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;font:30px Georgia}.title{font:normal clamp(25px,5.1vw,59px)/1 Georgia,serif;letter-spacing:-.05em;text-wrap:balance}.caption{font-size:clamp(.76rem,1.4vw,1rem);max-width:24ch}.arrow{font-size:1.3rem}.eyebrow{letter-spacing:.17em}.spark{filter:drop-shadow(0 0 6px #f9c566);stroke-dasharray:16 132;stroke-dashoffset:18;opacity:0}
@media(prefers-reduced-motion:no-preference){header,.choice,footer{animation:arrive .85s cubic-bezier(.2,.7,.3,1) both}.choice{animation-delay:.1s}.spark{animation:glint 1.55s .23s ease-out both}.arrow{transition:transform .25s}.choice a:hover .arrow{transform:translateX(5px)}}@keyframes arrive{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes glint{0%{opacity:0;stroke-dashoffset:17}20%{opacity:1}80%{opacity:.8}100%{opacity:0;stroke-dashoffset:-115}}
@media(max-width:420px){.choice a{padding-inline:8px}.symbol{width:45px;height:45px;font-size:24px}.eyebrow{font-size:.61rem}}
.install-button{margin:0 0 18px;padding:11px 18px;border:1px solid #ba9666;border-radius:999px;background:#172b23;color:#fff1da;font:600 .9rem system-ui;cursor:pointer}.install-button:focus-visible{outline:2px solid #f7d5a1;outline-offset:4px}#install-help{width:min(420px,calc(100% - 32px));border:1px solid #ba9666;border-radius:20px;padding:22px;background:#fff4df;color:#172b23}#install-help h2{margin-top:0}#install-help::backdrop{background:#101814bb}.entry{position:relative}.pont-admin-entry{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:clamp(12px,3vw,28px);z-index:3;display:inline-flex;align-items:center;justify-content:center;margin:0;padding:8px 11px;border:1px solid #4b8f82;border-radius:999px;color:#b9d6ce;background:#142a25;text-decoration:none;font:500 12px system-ui;opacity:.8}.pont-admin-entry:hover,.pont-admin-entry:focus-visible{opacity:1;outline:1px solid #74c7b6}</style><link rel="stylesheet" href="./pont-editorial.css?v=1"><style>
.pont-intro{
  position:fixed;inset:0;z-index:20;overflow:hidden;overscroll-behavior:none;
  display:grid;place-items:center;color:#fff;touch-action:none;
}
.pont-intro[hidden]{display:none}
.pont-intro canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.pont-intro__skip{
  position:absolute;bottom:calc(25px + env(safe-area-inset-bottom, 0px));
  min-height:44px;padding:10px 16px;border:0;border-radius:999px;
  color:#d1d1d1;background:#080808b0;
  font:500 .65rem/1 system-ui,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;transition:opacity .25s ease;
}
.pont-intro__skip:focus-visible{outline:1px solid #fff;outline-offset:3px}
.pont-intro.is-revealing .pont-intro__skip:not(:focus-visible){opacity:0}
html.pont-intro-active{overflow:hidden}
.entry.intro-matched :is(header,.choice,footer,.spark){animation:none}
@media(prefers-reduced-motion:reduce){.pont-intro{display:none}}
</style></head>
<body class="entry-page"><main class="entry"><a href="./login/" class="pont-admin-entry" aria-label="Acces administrator">⚙ Administrator</a><header><h1><img src="./pont.svg" width="320" height="92" alt="PONT Slobozia" style="display:block;width:min(320px,80vw);height:auto"></h1><div class="subtitle">Ce mâncăm azi? Unde ieșim diseară?</div></header>
<div class="choice" aria-label="Alege cum vrei să continui">
<svg class="scene" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="day" x2="1" y2="1"><stop stop-color="#f0f4e2"/><stop offset="1" stop-color="#ceddc5"/></linearGradient><linearGradient id="night" x2="1" y2="1"><stop stop-color="#315848"/><stop offset="1" stop-color="#142c26"/></linearGradient></defs><path fill="url(#night)" d="M0 0H100V100H0Z"/><path fill="url(#day)" d="M0 0H50C63 31 37 69 50 100H0Z"/></svg>
<a class="day" href="./meniul-zilei/"><span class="symbol" aria-hidden="true">☀</span><span class="eyebrow">La prânz</span><span class="title">Meniul zilei</span><span class="caption">Vezi ce gătesc azi restaurantele din oraș.</span><span class="arrow" aria-hidden="true">→</span></a>
<a class="night" href="./iesire-in-oras/"><span class="symbol" aria-hidden="true">☾</span><span class="eyebrow">Diseară</span><span class="title">Ieșire în oraș</span><span class="caption">Alege restaurantul după atmosfera serii.</span><span class="arrow" aria-hidden="true">→</span></a>
<svg class="seam" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0C63 31 37 69 50 100" fill="none" stroke="#bd925a" stroke-width="1.2" vector-effect="non-scaling-stroke"/><path class="spark" d="M50 0C63 31 37 69 50 100" pathLength="132" fill="none" stroke="#fff3b9" stroke-width="2.6" vector-effect="non-scaling-stroke"/></svg>
</div><button type="button" class="install-button" id="install-pont">Descarcă aplicația PONT</button><dialog id="install-help" aria-labelledby="install-title"><h2 id="install-title">Instalează PONT</h2><p></p><form method="dialog"><button class="install-button">Am înțeles</button></form></dialog><footer>Două feluri de a te bucura de oraș</footer></main><div class="pont-intro" id="pont-intro" hidden><canvas aria-hidden="true"></canvas><button class="pont-intro__skip" type="button">Sari peste intro</button></div>
<script>
(() => {
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  if (motion.matches) return;

  // Intro replays whenever the main entry page is opened.

  const intro = document.querySelector('#pont-intro');
  const page = document.querySelector('.entry');
  if (!intro || !page) return;
  const logo = page.querySelector('header img');
  const chooser = page.querySelector('.choice');
  const canvas = intro.querySelector('canvas');
  const context = canvas.getContext('2d');
  if (!context || !logo || !chooser) return;

  const skip = intro.querySelector('button');
  const root = document.documentElement;
  const turn = Math.PI * 2;
  const liftAt = .94;
  const liftEnd = 1.88;
  const revealAt = 1.43;
  const duration = 2.76;
  const rowCount = 72;
  const starSteps = 2048;
  const shadeCount = 10;
  const glyphs = [...'PONT'];
  let frame = 0;
  let deadline = 0;
  let finished = false;
  let revealing = false;
  let width, height, stars, rim, word, spark, curtain;
  const clamp = value => Math.max(0, Math.min(1, value));
  const along = (start, end, t) => start + (end - start) * t;
  const ease = (start, end, value) => {
    const t = clamp((value - start) / (end - start));
    return t * t * (3 - 2 * t);
  };

  function randomGenerator(seed) {
    return () => {
      seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  function makeRim() {
    const outline = [];
    let length = 0;
    // Sample by distance, so the stars flow at the same speed around the corners.
    for (let i = 0; i <= 768; i++) {
      const angle = turn * i / 768;
      const c = Math.cos(angle), s = Math.sin(angle);
      const x = Math.sign(c) * Math.pow(Math.abs(c), .47) * width * .498;
      const y = Math.sign(s) * Math.pow(Math.abs(s), .47) * height * .498;
      if (i) length += Math.hypot(x - outline[i - 1].x, y - outline[i - 1].y);
      outline.push({ x, y, length });
    }

    let segment = 1;
    const points = Array.from({ length: starSteps + 1 }, (_, i) => {
      const distance = length * i / starSteps;
      while (outline[segment].length < distance && segment < outline.length - 1) segment++;
      const a = outline[segment - 1], b = outline[segment];
      const portion = (distance - a.length) / (b.length - a.length);
      return { x: along(a.x, b.x, portion), y: along(a.y, b.y, portion) };
    });
    return { points, length };
  }

  function makeStars() {
    const random = randomGenerator(73109);
    const count = Math.min(3500, Math.max(1750, Math.round(rim.length * 1.07)));
    const tempo = Math.min(width, height) * .059;
    return Array.from({ length: count }, (_, index) => {
      const band = .81 + random() * .19;
      const distance = (index + random()) / count * starSteps;
      const clarity = 1 - ease(.925, 1, band);
      const fade = along(.26, 1, ease(.81, .88, band)) * along(.20, 1, clarity);
      const size = .26 + Math.pow(random(), 3.6) * .88;
      return {
        band, distance, clarity, size,
        light: (.20 + Math.pow(random(), 2) * .76) * fade,
        phase: random() * turn,
        speed: (tempo + random() * tempo * .72) * starSteps / rim.length,
      };
    });
  }

  function makeSpark() {
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = 18;
    const glow = sprite.getContext('2d');
    const falloff = glow.createRadialGradient(9, 9, 0, 9, 9, 9);
    falloff.addColorStop(0, '#fffd');
    falloff.addColorStop(.27, '#fff6');
    falloff.addColorStop(1, '#fff0');
    glow.fillStyle = falloff;
    glow.fillRect(0, 0, 18, 18);
    return sprite;
  }

  function makeWord(bounds) {
    const size = Math.min(100, Math.min(width, height) * .11);
    const tracking = size * .185;
    const face = 'px Georgia,serif';
    context.font = size + face;
    const metrics = glyphs.map(glyph => context.measureText(glyph));
    const widths = metrics.map(metric => metric.width);
    const span = widths.reduce((sum, advance) => sum + advance, 0) + tracking * 3;
    const ascent = Math.max(...metrics.map(metric => metric.actualBoundingBoxAscent || size * .67));
    const descent = Math.max(...metrics.map(metric => metric.actualBoundingBoxDescent || 0));
    const padding = 25;
    const glowWidth = Math.ceil(span + padding * 2);
    const glowHeight = Math.ceil(size + padding * 2);
    const glowBaseline = padding + ascent;
    const halo = document.createElement('canvas');
    halo.width = glowWidth * 2;
    halo.height = glowHeight * 2;
    const ink = halo.getContext('2d');
    ink.scale(2, 2);
    ink.font = size + face;
    ink.shadowColor = '#fff';
    ink.shadowBlur = 17;
    ink.fillStyle = '#fff';
    let x = padding;
    for (const [i, glyph] of glyphs.entries()) {
      ink.fillText(glyph, x, glowBaseline);
      x += widths[i] + tracking;
    }

    // Map to the typography already inside pont.svg (320 × 92).
    const logoScale = bounds.width / 320;
    return {
      size, tracking, face, widths, ascent, descent, halo, glowWidth, glowHeight, glowBaseline, padding,
      fromX: (width - span) / 2, fromY: (height + ascent - descent) / 2,
      toX: bounds.left + 91 * logoScale, toY: bounds.top + 55 * logoScale,
      toSize: 47 * logoScale, toTracking: 5 * logoScale,
    };
  }

  function makeCurtain(bounds, brand) {
    const center = bounds.left + bounds.width / 2;
    const maxOpening = Math.max(center, width - center) + bounds.width * .045 + 22;
    return Array.from({ length: rowCount + 1 }, (_, index) => {
      const y = height * index / rowCount;
      const t = clamp((y - bounds.top) / bounds.height);
      // This cubic follows the S-shaped seam drawn between the two choices.
      const x = center + bounds.width * .39 * t * (1 - t) * (1 - 2 * t);
      const aboveLogo = 1 - ease(brand.bottom + 12, brand.bottom + height * .16 + 12, y);
      return { x, y, delay: .42 * (1 - index / rowCount) + .25 * aboveLogo, maxOpening };
    });
  }

  function resize() {
    width = intro.clientWidth;
    height = intro.clientHeight;
    const ratio = Math.min(devicePixelRatio || 1, 2, Math.sqrt(2200000 / (width * height)));
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    context.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
    rim = makeRim();
    stars = makeStars();
    const brand = logo.getBoundingClientRect();
    word = makeWord(brand);
    curtain = makeCurtain(chooser.getBoundingClientRect(), brand);
  }

  function drawStars(time) {
    const shadePaths = Array.from({ length: shadeCount }, () => new Path2D());
    const slide = ease(revealAt, duration - .1, time);
    const offset = width * .30 * slide;
    const lightFalloff = 1 - .64 * slide;
    for (const star of stars) {
      const distance = (star.distance + time * star.speed) % starSteps;
      const slot = Math.floor(distance);
      const a = rim.points[slot], b = rim.points[slot + 1];
      const fraction = distance - slot;
      const x = along(a.x, b.x, fraction) * star.band;
      const y = along(a.y, b.y, fraction) * star.band;
      const screenX = width / 2 + x + Math.tanh(x / (width * .12)) * offset;
      const screenY = height / 2 + y;
      if (screenX < -7 || screenX > width + 7) continue;
      const shimmer = .83 + .17 * Math.sin(time * 2.2 + star.phase);
      const light = star.light * shimmer * lightFalloff;
      const size = star.size * along(.83, 1, star.clarity);

      // A small soft halo carries the outer points; sharper points sit inside it.
      if (star.size > .66 && (star.clarity < .78 || light > .33)) {
        const radius = size * along(4.1, 2.9, star.clarity);
        context.globalAlpha = light * along(.90, .44, star.clarity);
        context.drawImage(spark, screenX - radius, screenY - radius, radius * 2, radius * 2);
      }
      const crisp = light * along(.31, 1, star.clarity);
      const shade = Math.min(shadeCount - 1, Math.floor(crisp * shadeCount));
      if (crisp > .045) shadePaths[shade].rect(screenX - size, screenY - size, size * 2, size * 2);
    }
    context.fillStyle = '#fff';
    for (const [index, path] of shadePaths.entries()) {
      context.globalAlpha = (index + .5) / shadeCount;
      context.fill(path);
    }
    context.globalAlpha = 1;
  }

  function drawWord(time) {
    const lift = ease(liftAt, liftEnd, time);
    const size = along(word.size, word.toSize, lift);
    const tracking = along(word.tracking, word.toTracking, lift);
    const scale = size / word.size;
    const x = along(word.fromX, word.toX, lift);
    const y = along(word.fromY, word.toY, lift);

    if (lift < 1) {
      const breath = .69 + .21 * Math.sin(time * 3.2);
      context.globalAlpha = breath * (1 - lift) * .84;
      context.drawImage(word.halo, x - word.padding * scale, y - word.glowBaseline * scale,
        word.glowWidth * scale, word.glowHeight * scale);
      context.globalAlpha = 1;
    }

    const sheen = context.createLinearGradient(0, y - word.ascent * scale, 0, y + word.descent * scale);
    const warm = (tone, green, blue) =>
      'rgb(' + [along(tone, 255, lift), along(tone, green, lift), along(tone, blue, lift)].map(Math.round).join(',') + ')';
    sheen.addColorStop(0, warm(255, 241, 218));
    sheen.addColorStop(.62, warm(196, 241, 218));
    sheen.addColorStop(1, warm(242, 241, 218));
    context.font = size + word.face;
    context.fillStyle = sheen;
    context.strokeStyle = '#fff';
    context.lineWidth = .5 * scale;
    let advance = x;
    for (const [index, glyph] of glyphs.entries()) {
      context.fillText(glyph, advance, y);
      if (lift < 1) {
        context.globalAlpha = .74 * (1 - lift);
        context.strokeText(glyph, advance, y);
        context.globalAlpha = 1;
      }
      advance += word.widths[index] * scale + tracking;
    }
  }

  function reveal(time) {
    if (time < revealAt) return;
    if (!revealing) {
      revealing = true;
      intro.classList.add('is-revealing');
    }
    const rows = curtain.map(row => ({
      ...row,
      opening: row.maxOpening * ease(revealAt + row.delay, duration - .02, time),
    }));
    const makeEdge = (side, feather) => rows.map(row => {
      const opening = Math.max(0, row.opening + feather * clamp(row.opening / 16));
      return { x: row.x + side * opening, y: row.y };
    });
    const line = (points, move) => {
      const [first, ...rest] = points;
      if (move) context.moveTo(first.x, first.y);
      else context.lineTo(first.x, first.y);
      for (const point of rest) context.lineTo(point.x, point.y);
    };

    context.globalCompositeOperation = 'destination-out';
    context.fillStyle = '#fff';
    for (const [feather, alpha] of [[9, .15], [5, .24], [1, .39], [-4, 1]]) {
      context.globalAlpha = alpha;
      context.beginPath();
      line(makeEdge(-1, feather), true);
      line(makeEdge(1, feather).reverse(), false);
      context.closePath();
      context.fill();
    }
    context.globalCompositeOperation = 'source-over';

    const trace = context.createLinearGradient(0, 0, 0, height);
    trace.addColorStop(0, '#fff0');
    trace.addColorStop(.33, '#fff5');
    trace.addColorStop(.63, '#fff7');
    trace.addColorStop(1, '#fff0');
    context.globalAlpha = .71 * ease(revealAt, revealAt + .29, time) * (1 - ease(2.05, 2.65, time));
    context.strokeStyle = trace;
    context.lineWidth = .7;
    context.beginPath();
    line(makeEdge(-1, -2), true);
    line(makeEdge(1, -2), true);
    context.stroke();
    context.globalAlpha = 1;
  }

  function paint(time) {
    context.fillStyle = '#030303';
    context.fillRect(0, 0, width, height);
    drawStars(time);
    drawWord(time);
    reveal(time);
  }

  function finish() {
    if (finished) return;
    finished = true;
    const returnFocus = document.activeElement === skip;
    cancelAnimationFrame(frame);
    clearTimeout(deadline);
    window.removeEventListener('resize', onResize);
    window.removeEventListener('pagehide', finish);
    document.removeEventListener('keydown', onKey);
    motion.removeEventListener?.('change', onMotion);
    intro.hidden = true;
    root.classList.remove('pont-intro-active');
    page.inert = false;
    canvas.width = canvas.height = 0;
    word = stars = rim = spark = curtain = undefined;
    if (returnFocus) chooser.querySelector('a')?.focus();
  }

  function onKey(event) {
    if (event.key === 'Escape') finish();
  }

  function onMotion(event) {
    if (event.matches) finish();
  }

  function onResize() {
    try {
      resize();
    } catch {
      finish();
    }
  }

  intro.hidden = false;
  page.inert = true;
  page.classList.add('intro-matched');
  root.classList.add('pont-intro-active');
  try {
    resize();
    spark = makeSpark();
    paint(0);
  } catch {
    finish();
    return;
  }

  try { void 0; } catch {}
  skip.addEventListener('click', finish, { once: true });
  window.addEventListener('resize', onResize);
  window.addEventListener('pagehide', finish);
  document.addEventListener('keydown', onKey);
  motion.addEventListener?.('change', onMotion);
  deadline = setTimeout(finish, duration * 1000 + 200);

  const started = performance.now();
  function tick(now) {
    const time = Math.max(0, (now - started) / 1000);
    if (time >= duration) {
      finish();
      return;
    }
    try {
      paint(time);
      frame = requestAnimationFrame(tick);
    } catch {
      finish();
    }
  }
  frame = requestAnimationFrame(tick);
})();
</script></body></html>
