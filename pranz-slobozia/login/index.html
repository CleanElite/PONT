<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PONT | Autentificare</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 10%,#164b57,#071923 72%);font:15px system-ui;color:#eef8f8;padding:18px}main{width:min(100%,460px);border:1px solid #2c5964;border-radius:27px;background:#0d2b36;padding:clamp(22px,5vw,38px);box-shadow:0 25px 90px #0005}.brand{font-weight:850;letter-spacing:.2em;font-size:25px}.brand span{color:#6fe3d5}h1{font-size:30px;margin:25px 0 8px}p{color:#b7cfd1;line-height:1.6}label{display:block;margin:17px 0 7px;color:#c8e1e2}input{width:100%;border:1px solid #416b75;border-radius:12px;background:#08202a;color:#fff;padding:14px;font:16px system-ui}button{border:1px solid #376a73;background:#183f4b;color:#fff;border-radius:12px;padding:13px 17px;font:600 15px system-ui;cursor:pointer}button.primary{background:#74e5d5;border-color:#74e5d5;color:#062b30;width:100%;margin-top:22px}button:disabled{opacity:.6}a{color:#8deadd}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}.error{color:#ffb5b5}.ok{color:#8ff0c4}[hidden]{display:none!important}</style><main><div class="brand">P<span>O</span>NT</div><h1>Acces administratori</h1><p>Completează datele și apasă „Conectare” pentru a intra în panoul tău.</p><form id="form"><label for="email">Email sau nume de utilizator</label><input id="email" type="text" autocomplete="username" required><label for="password">Parolă</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="submit">Conectare</button></form><p id="status" role="status"></p><div class="links"><button type="button" id="reset">Ai uitat parola?</button><a href="../">← Înapoi la PONT</a></div></main><script src="../super-admin/config.js"></script><script type="module">
const c=window.PONT_CONFIG||{},s=document.getElementById('status'),f=document.getElementById('form'),b=document.getElementById('submit');if(!c.url||!c.anonKey){s.textContent='Conexiunea cu serviciul de autentificare nu este configurată.';f.hidden=true}else init().catch(e=>s.textContent=e.message);
async function init(){const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const db=createClient(c.url,c.anonKey);async function redirect(){const {data:{user},error}=await db.auth.getUser();if(error||!user)return;const {data:profile,error:pe}=await db.from('profiles').select('role').eq('user_id',user.id).maybeSingle();if(pe)throw pe;if(!profile){s.textContent='Contul nu are încă un rol PONT. Contactează administratorul.';return}if(profile.role==='super_admin'){location.replace('../super-admin/');return}if(profile.role==='restaurant'){const {data:me,error:memberError}=await db.rpc('my_restaurant_access');if(memberError)throw memberError;if(me?.length){location.replace('../admin-v2/');return}s.textContent='Contul nu are încă un restaurant atribuit.';return}s.textContent='Rolul contului nu este recunoscut.'}
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;s.textContent='Se verifică datele...';const identifier=document.getElementById('email').value.trim();let error;if(identifier.includes('@')){({error}=await db.auth.signInWithPassword({email:identifier,password:document.getElementById('password').value}))}else{try{const res=await fetch(c.url+'/functions/v1/pont-restaurant-accounts',{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anonKey},body:JSON.stringify({action:'login',username:identifier,password:document.getElementById('password').value})});const result=await res.json();if(!res.ok)throw Error(result.error||'Autentificare eșuată');({error}=await db.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token}))}catch(err){error=err}}if(error)s.textContent='Autentificare eșuată. Verifică utilizatorul și parola.';else try{await redirect()}catch(err){s.textContent=err.message}b.disabled=false};
document.getElementById('reset').onclick=async()=>{const email=document.getElementById('email').value.trim();if(email&&!email.includes('@')){s.textContent='Pentru conturile cu nume de utilizator, parola se resetează de către Super Admin.';return}if(!email){s.textContent='Introdu adresa de email, apoi apasă din nou.';return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});s.textContent=error?'Nu s-a putut trimite mesajul.':'Dacă adresa există, vei primi un email pentru resetarea parolei.'};
// La deschiderea paginii afișăm întotdeauna formularul, fără redirecționare automată.
}
</script></html>
